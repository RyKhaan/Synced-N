<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Synced N — Church Music Ministry & Lineup Management</title>
  <meta name="description" content="Professional Church Music Ministry Schedule, Lineup, and Song Management Platform" />
  <meta name="theme-color" content="#F8FAFC" />
  <link rel="icon" type="image/png" href="/assets/logo.png" />

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6 Free Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace']
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="bg-[#F8FAFC] text-slate-900 antialiased selection:bg-indigo-100 selection:text-indigo-900">
  <!-- Main Application Mount Point -->
  <div id="app" class="min-h-screen flex flex-col">
    <!-- Initial Loading State -->
    <div class="min-h-screen flex flex-col items-center justify-center p-6 text-center bg-[#F8FAFC]">
      <div class="w-12 h-12 rounded-lg bg-white border border-slate-200 shadow-sm flex items-center justify-center mb-4">
        <img src="/assets/logo.png" alt="Synced N" class="w-8 h-8 object-contain" />
      </div>
      <div class="flex items-center gap-2.5 text-slate-700 font-medium text-sm">
        <i class="fa-solid fa-circle-notch fa-spin text-indigo-600 text-xs"></i>
        <span>Loading Synced N workspace...</span>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-[100] flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

  <!-- Global Modal Container -->
  <div id="modal-root" class="fixed inset-0 z-[90] hidden items-center justify-center p-4 bg-slate-900/40 backdrop-blur-[1px] overflow-y-auto"></div>

  <!-- Main Application Entry Module -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
