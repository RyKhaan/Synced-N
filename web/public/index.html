<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Synced N — Church Music Ministry & Lineup Management</title>
  <meta name="description" content="Professional Church Music Ministry Schedule, Lineup, Calendar, and Song Management Platform" />
  <meta name="theme-color" content="#10113F" />
  <link rel="icon" type="image/png" href="/assets/logo.png" />

  <!-- Apply Persisted Theme Before First Paint -->
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem("synced_n_theme");
        var theme = savedTheme === "dark" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", theme);
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      } catch (e) {}
    })();
  </script>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6 Free Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            synced: {
              navy: '#10113F',
              navyDark: '#080720',
              navyMid: '#151269',
              purple: '#500568',
              purpleHover: '#3D0350',
              magenta: '#9E069F',
              lilac: '#F5D0FE',
              lilacTint: '#FDF4FF',
              surface: '#F5F5F8'
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace']
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="antialiased selection:bg-[#F5D0FE] selection:text-[#500568]">
  <!-- Main Application Mount Point -->
  <div id="app" class="min-h-screen flex flex-col">
    <!-- Initial Loading State -->
    <div class="min-h-screen flex flex-col items-center justify-center p-6 text-center app-bg">
      <div class="w-14 h-14 rounded-2xl surface-card flex items-center justify-center mb-4">
        <img src="/assets/logo.png" alt="Synced N" class="w-9 h-9 object-contain" />
      </div>
      <div class="flex items-center gap-2.5 font-semibold text-sm">
        <i class="fa-solid fa-circle-notch fa-spin text-[#500568] dark:text-[#E879F9] text-xs"></i>
        <span>Loading Synced N workspace...</span>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-20 md:bottom-5 right-4 md:right-5 z-[110] flex flex-col gap-2 max-w-sm w-full pointer-events-none px-2 sm:px-0"></div>

  <!-- Global Modal Container -->
  <div id="modal-root" class="fixed inset-0 z-[95] hidden items-center justify-center p-3 sm:p-4 bg-[#080720]/65 backdrop-blur-[2px] overflow-y-auto"></div>

  <!-- Main Application Entry Module -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
